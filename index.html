<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Fuego & Carbón</title>
    <!-- Favicon principal optimizado -->
    <link rel="icon" type="image/png" sizes="32x32" href="img.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img.png">
    <link rel="apple-touch-icon" href="img.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-card: rgba(24, 24, 27, 0.92);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --primary: #f97316;
            --primary-hover: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --accent-green: #22c55e;
            --accent-green-bg: rgba(34, 197, 94, 0.12);
            --accent-green-border: rgba(34, 197, 94, 0.3);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
            margin: 16px 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        body { 
            background-color: #0c0c0e;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><g fill="none" stroke="%2327272a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15,35 C15,25 35,25 35,35 Z M12,35 L38,35 M15,35 L15,42 C15,45 35,45 35,42 L35,35 M20,38 L30,38"/><path d="M85,15 L95,15 L92,40 L88,40 Z M83,22 L97,22 M85,15 L80,10"/><path d="M15,85 L35,85 L38,105 L12,105 Z M18,85 L25,85 L25,75 M32,85 L30,78"/><path d="M75,80 L105,80 L90,108 Z M80,89 C83,89 83,93 80,93 M92,92 L92,97"/><path d="M55,20 C50,15 50,25 55,28 C60,25 60,15 55,20 Z M55,28 L55,33"/><circle cx="60" cy="95" r="8"/><path d="M60,83 L60,87 M68,95 L72,95 M60,103 L60,107 M52,95 L48,95"/></g></svg>');
            background-repeat: repeat;
            background-size: 130px 130px;
            color: var(--text-main); 
            padding-bottom: 120px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        .app-container { 
            width: 100%; 
            max-width: 520px; 
            position: relative; 
        }

        .header-card {
            margin: 16px 16px 8px 16px;
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid var(--bg-card-border);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-cover {
            position: relative;
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #1c1917 0%, #09090b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--bg-card-border);
        }

        .cover-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            color: rgba(249, 115, 22, 0.35);
            text-transform: uppercase;
        }

        .logo-wrapper {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #18181b;
            border: 3px solid #27272a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
            z-index: 10;
            font-size: 24px;
            color: var(--primary);
            font-weight: 800;
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: translateX(-50%) scale(1.05) rotate(5deg);
        }

        .restaurant-info {
            text-align: center;
            padding: 42px 16px 18px 16px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: #d4d4d8;
            margin-bottom: 6px;
            line-height: 1.4;
            font-weight: 500;
        }

        .info-icon {
            width: 16px;
            height: 16px;
            stroke: var(--primary);
            flex-shrink: 0;
        }

        .status-box {
            background: var(--accent-green-bg);
            border: 1px solid var(--accent-green-border);
            border-radius: 18px;
            padding: 14px 18px;
            margin: 10px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease;
        }

        .status-box.closed {
            background: var(--danger-bg);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .status-box:hover {
            transform: translateY(-2px);
        }

        .status-icon {
            width: 20px;
            height: 20px;
            stroke: #4ade80;
            flex-shrink: 0;
        }

        .status-box.closed .status-icon {
            stroke: #f87171;
        }

        .status-text {
            font-size: 13px;
            color: #f0fdf4;
            line-height: 1.45;
            font-weight: 500;
        }

        .status-box.closed .status-text {
            color: #fee2e2;
        }

        .status-text strong {
            color: #4ade80;
            font-weight: 700;
        }

        .status-box.closed .status-text strong {
            color: #f87171;
        }

        .search-container {
            padding: 8px 16px 12px 16px;
        }

        .search-box {
            width: 100%;
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid var(--bg-card-border);
            border-radius: 25px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.2);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13px;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .categories-bar { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 8px; 
            padding: 8px 16px 16px 16px; 
            margin: 0;
            width: 100%;
        }

        .cat-btn { 
            background: rgba(24, 24, 27, 0.9); 
            color: var(--text-muted); 
            border: 1px solid var(--bg-card-border); 
            padding: 8px 14px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cat-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .cat-btn:active {
            transform: scale(0.95);
        }

        .cat-btn.active { 
            background: linear-gradient(135deg, var(--primary), #c2410c); 
            color: #fff; 
            border-color: transparent; 
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            transform: translateY(-2px);
        }

        .products-section { 
            padding: 0 16px; 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 14px; 
        }

        .product-card { 
            display: flex; 
            gap: 14px; 
            background: var(--bg-card); 
            border: 1px solid var(--bg-card-border); 
            border-radius: 20px; 
            padding: 14px; 
            align-items: center; 
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: rgba(249, 115, 22, 0.4);
            box-shadow: 0 15px 35px rgba(249, 115, 22, 0.15);
        }

        .product-img-wrapper {
            width: 95px;
            height: 95px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            background: #27272a;
        }

        .product-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.1);
        }

        .product-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; height: 95px; }
        .product-title { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-desc { font-size: 11px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; line-height: 1.4; }
        .product-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 16px; font-weight: 800; color: #fb923c; }

        .add-btn { 
            width: 34px; 
            height: 34px; 
            border-radius: 12px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
            color: #fff; 
            border: none; 
            font-size: 18px; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(249, 115, 22, 0.5);
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        .cart-floating-container { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: calc(100% - 32px); 
            max-width: 480px; 
            z-index: 20; 
            animation: bounceUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceUp {
            from { transform: translate(-50%, 50px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .cart-btn { 
            width: 100%; 
            background: linear-gradient(90deg, #f97316, #eab308); 
            color: #fff; 
            border: none; 
            padding: 16px 20px; 
            border-radius: 18px; 
            font-size: 14px; 
            font-weight: 800; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 12px 30px rgba(249, 115, 22, 0.5); 
            cursor: pointer; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cart-btn.closed-btn {
            background: #27272a;
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        .cart-btn:hover:not(.closed-btn) {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(249, 115, 22, 0.7);
        }

        .cart-btn:active:not(.closed-btn) {
            transform: scale(0.98);
        }

        .modal { 
            display: flex; 
            opacity: 0; 
            pointer-events: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(12px); 
            z-index: 50; 
            align-items: flex-end; 
            justify-content: center; 
            transition: opacity 0.3s ease;
        }

        .modal.active { opacity: 1; pointer-events: auto; }

        .modal-content { 
            background: #18181b; 
            border: 1px solid var(--bg-card-border); 
            width: 100%; 
            max-width: 520px; 
            border-radius: 28px 28px 0 0; 
            padding: 18px 20px; 
            max-height: 94vh; 
            overflow-y: auto; 
            overflow-x: hidden;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            position: relative;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }

        .close-modal-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-modal-btn:hover { background: rgba(255,255,255,0.15); color: #fff; transform: rotate(90deg); }

        .section-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            margin-top: 8px;
        }

        .cart-items-container {
            max-height: 120px;
            overflow-y: auto;
            overflow-x: hidden;
            margin-bottom: 8px;
            padding-right: 2px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            font-size: 12px;
            transition: background 0.2s;
        }

        .cart-item-row:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            padding-right: 12px;
        }

        .cart-item-name {
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }

        .cart-item-price {
            color: #fb923c;
            font-weight: 700;
            font-size: 12px;
        }

        .remove-item-btn {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .remove-item-btn:hover {
            background: var(--danger);
            color: #fff;
            transform: scale(1.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-input, .form-select { 
            width: 100%; 
            background: #27272a; 
            border: 1px solid var(--bg-card-border); 
            padding: 10px 12px; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 12px; 
            margin-bottom: 6px; 
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus, .form-select:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.2);
        }

        .form-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 2px;
            display: block;
            font-weight: 700;
            text-transform: uppercase;
        }

        .totals-card {
            background: rgba(249, 115, 22, 0.05);
            border: 1px solid rgba(249, 115, 22, 0.2);
            padding: 10px 12px;
            border-radius: 12px;
            margin: 8px 0;
            font-size: 12px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .total-row.grand {
            border-top: 1px dashed rgba(249, 115, 22, 0.3);
            padding-top: 6px;
            margin-top: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
        }

        .total-row.grand span:last-child {
            color: var(--primary);
        }

        .confirm-btn { 
            width: 100%; 
            background: linear-gradient(135deg, #22c55e, #16a34a); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 13px; 
            cursor: pointer; 
            margin-top: 4px; 
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .confirm-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }

        .confirm-btn:active {
            transform: scale(0.98);
        }

        @media (min-width: 768px) {
            .app-container { max-width: 860px; }
            .products-section { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .cart-floating-container { max-width: 420px; }
            .modal { align-items: center; }
            .modal-content { border-radius: 28px; transform: scale(0.9); transition: transform 0.3s ease; }
            .modal.active .modal-content { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header-card">
            <div class="header-cover">
                <div class="cover-title">FUEGO & CARBÓN</div>
                <div class="logo-wrapper">FC</div>
            </div>

            <div class="restaurant-info">
                <h1 class="brand-title">Fuego & Carbón</h1>
                <div class="info-item">
                    <svg class="info-icon" fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-6-5.33-6-10a6 6 0 1 1 12 0c0 4.67-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
                    <span>Sede Principal — Calle 15 #24-10, Centro</span>
                </div>
                <div class="info-item">
                    <svg class="info-icon" fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                    <span>Atención: Lunes a Sábados de 5:00 PM a 11:30 PM</span>
                </div>
            </div>
        </header>

        <div class="status-box" id="status-box">
            <svg class="status-icon" id="status-icon" fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <div class="status-text" id="status-text">
                Verificando horario...
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Buscar por plato o ingrediente..." oninput="handleSearch()">
            </div>
        </div>

        <nav class="categories-bar">
            <button class="cat-btn active" onclick="filterCategory('Más Vendidas', this)">Más Vendidas</button>
            <button class="cat-btn" onclick="filterCategory('Combos', this)">Combos</button>
            <button class="cat-btn" onclick="filterCategory('Hamburguesas', this)">Hamburguesas</button>
            <button class="cat-btn" onclick="filterCategory('Salchipapas', this)">Salchipapas</button>
            <button class="cat-btn" onclick="filterCategory('Perros Calientes', this)">Perros Calientes</button>
            <button class="cat-btn" onclick="filterCategory('Picadas', this)">Picadas</button>
            <button class="cat-btn" onclick="filterCategory('Patacones Rellenos', this)">Patacones Rellenos</button>
            <button class="cat-btn" onclick="filterCategory('Pizzas', this)">Pizzas</button>
            <button class="cat-btn" onclick="filterCategory('Acompañamientos', this)">Acompañamientos</button>
            <button class="cat-btn" onclick="filterCategory('Bebidas', this)">Bebidas</button>
        </nav>

        <main class="products-section" id="products-list"></main>

        <div class="cart-floating-container">
            <button class="cart-btn" id="main-cart-btn" onclick="openCheckout()">
                <span id="cart-count">Ver pedido (0)</span>
                <span id="cart-total">$0</span>
            </button>
        </div>

        <div class="modal" id="checkout-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Finalizar Pedido</div>
                    <button class="close-modal-btn" onclick="closeCheckout()">✕</button>
                </div>

                <div class="section-subtitle">1. Productos seleccionados</div>
                <div id="cart-items" class="cart-items-container"></div>

                <div class="section-subtitle">2. Datos de entrega y contacto</div>
                <div class="form-grid">
                    <div>
                        <label class="form-label">Nombre *</label>
                        <input type="text" id="cust-name" class="form-input" placeholder="Tu nombre">
                    </div>
                    <div>
                        <label class="form-label">WhatsApp *</label>
                        <input type="tel" id="cust-phone" class="form-input" placeholder="Ej: 3188441670">
                    </div>
                </div>

                <label class="form-label">Tipo de servicio *</label>
                <select id="fulfillment-type" class="form-select" onchange="toggleDeliveryFields()">
                    <option value="domicilio">Domicilio (+$5.000)</option>
                    <option value="recoger">Pasar a recoger por el local</option>
                </select>

                <div id="address-container">
                    <label class="form-label">Dirección exacta *</label>

        let cart = [];
        let currentCategory = 'Más Vendidas';
        const deliveryFee = 5000;
        let isRestaurantOpen = false;

        function checkOpenStatus() {
            const now = new Date();
            const day = now.getDay(); // 0 = Domingo, 1 = Lunes, 2 = Martes ... 6 = Sábado
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTimeMinutes = hours * 60 + minutes;

            // Horario: Lunes (1) a Sábado (6) de 5:00 PM (17:00) a 11:30 PM (23:30)
            const openingTime = 17 * 60; // 5:00 PM
            const closingTime = 23 * 60 + 30; // 11:30 PM

            const isDayAllowed = (day >= 1 && day <= 6);
            const isHourAllowed = currentTimeMinutes >= openingTime && currentTimeMinutes <= closingTime;

            isRestaurantOpen = isDayAllowed && isHourAllowed;

            const statusBox = document.getElementById('status-box');
            const statusIcon = document.getElementById('status-icon');
            const statusText = document.getElementById('status-text');
            const mainCartBtn = document.getElementById('main-cart-btn');

            if (isRestaurantOpen) {
                statusBox.classList.remove('closed');
                statusIcon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
                statusText.innerHTML = '¡Estamos <strong>Abiertos</strong>! Pide ahora y te confirmaremos el despacho de inmediato.';
                mainCartBtn.classList.remove('closed-btn');
            } else {
                statusBox.classList.add('closed');
                statusIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
                statusText.innerHTML = 'Restaurante <strong>Cerrado</strong>. Abrimos de Lunes a Sábados de 5:00 PM a 11:30 PM.';
                mainCartBtn.classList.add('closed-btn');
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('products-list');
            if(products.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); font-size:13px; grid-column: 1 / -1; padding: 30px 0;">No se encontraron productos.</p>`;
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img src="${p.image}" class="product-img" alt="${p.name}">
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-desc">${p.desc}</div>
                        </div>
                        <div class="product-bottom">
                            <span class="price">$${p.price.toLocaleString('es-CO')}</span>
                            <button class="add-btn" onclick="addToCart('${p.name}', ${p.price})">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            document.getElementById('search-input').value = '';
            renderProducts(allProducts.filter(p => p.category === category));
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            if(query.trim() === '') {
                filterCategory(currentCategory);
                return;
            }
            renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query)));
        }

        function addToCart(name, price) {
            if (!isRestaurantOpen) {
                alert('El restaurante se encuentra cerrado en este momento. No se pueden agregar productos hasta que volvamos a abrir.');
                return;
            }
            cart.push({ name, price });
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            renderCartModalItems();
            updateModalTotals();
            if(cart.length === 0) closeCheckout();
        }

        function updateCartUI() {
            const total = cart.reduce((acc, curr) => acc + curr.price, 0);
            document.getElementById('cart-count').innerText = `Ver pedido (${cart.length})`;
            document.getElementById('cart-total').innerText = `$${total.toLocaleString('es-CO')}`;
        }

        function toggleDeliveryFields() {
            const type = document.getElementById('fulfillment-type').value;
            document.getElementById('address-container').style.display = (type === 'recoger') ? 'none' : 'block';
            updateModalTotals();
        }

        function updateModalTotals() {
            const subtotal = cart.reduce((acc, curr) => acc + curr.price, 0);
            const type = document.getElementById('fulfillment-type').value;
            const currentDelivery = (type === 'domicilio') ? deliveryFee : 0;
            const grandTotal = subtotal + currentDelivery;

            document.getElementById('cart-summary-totals').innerHTML = `
                <div class="total-row"><span>Subtotal productos:</span> <b>$${subtotal.toLocaleString('es-CO')}</b></div>
                <div class="total-row"><span>Servicio de entrega:</span> <b>${currentDelivery > 0 ? '$' + currentDelivery.toLocaleString('es-CO') : 'Gratis (Recoges)'}</b></div>
                <div class="total-row grand"><span>Total a pagar:</span> <span>$${grandTotal.toLocaleString('es-CO')}</span></div>
            `;
        }

        function renderCartModalItems() {
            const container = document.getElementById('cart-items');
            if(cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:12px; padding: 10px 0;">Tu carrito está vacío</p>`;
                return;
            }
            container.innerHTML = cart.map((i, index) => `
                <div class="cart-item-row">
                    <div class="cart-item-info">
                        <span class="cart-item-name">${i.name}</span>
                        <span class="cart-item-price">$${i.price.toLocaleString('es-CO')}</span>
                    </div>
                    <button class="remove-item-btn" onclick="removeFromCart(${index})" title="Eliminar producto">✕</button>
                </div>
            `).join('');
        }

        function openCheckout() {
            if (!isRestaurantOpen) {
                alert('El restaurante está cerrado. No puedes realizar pedidos en este momento.');
                return;
            }
            if(cart.length === 0) return alert('El carrito está vacío');
            document.getElementById('checkout-modal').classList.add('active');
            renderCartModalItems();
            toggleDeliveryFields();
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').classList.remove('active');
        }

        function sendOrder() {
            if (!isRestaurantOpen) {
                alert('Lo sentimos, el restaurante acaba de cerrar o está cerrado.');
                return;
            }

            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            let fulfillment = document.getElementById('fulfillment-type').value;
            const address = document.getElementById('cust-address').value;
            const paymentMethod = document.getElementById('payment-method').value;

            if(!name || !phone) return alert('Por favor ingresa tu nombre y teléfono.');
            if(fulfillment === 'domicilio' && !address) return alert('Por favor ingresa la dirección de entrega para el domicilio.');

            const subtotal = cart.reduce((acc, curr) => acc + curr.price, 0);
            const currentDelivery = (fulfillment === 'domicilio') ? deliveryFee : 0;
            const total = subtotal + currentDelivery;

            let msg = `NUEVO PEDIDO - FUEGO & CARBON\n-------------------\n`;
            msg += `Cliente: ${name}\nTel: ${phone}\n`;
            msg += `Tipo de entrega: ${fulfillment === 'domicilio' ? 'Domicilio' : 'Pasa a recoger'}\n`;
            if(fulfillment === 'domicilio') msg += `Dirección: ${address}\n`;
            msg += `Método de pago: ${paymentMethod}\n-------------------\nPRODUCTOS:\n`;
            cart.forEach(i => msg += `- ${i.name} - $${i.price.toLocaleString('es-CO')}\n`);
            msg += `-------------------\nSubtotal: $${subtotal.toLocaleString('es-CO')}\n`;
            if(fulfillment === 'domicilio') msg += `Domicilio: $${deliveryFee.toLocaleString('es-CO')}\n`;
            msg += `TOTAL A PAGAR: $${total.toLocaleString('es-CO')}`;

            window.open(`https://wa.me/573188441670?text=${encodeURIComponent(msg)}`, '_blank');
        }

        checkOpenStatus();
        setInterval(checkOpenStatus, 60000);
        filterCategory('Más Vendidas');
    </script>
